name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The Windows job is opt-in — see the note on that job below
  workflow_dispatch:
    inputs:
      run_windows:
        description: "Also run the (unvalidated) Windows job"
        type: boolean
        default: true

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM
        run: brew install llvm cmake

      # Optional dependency: enables the game runtime and example/game/.
      # The compiler builds and all language tests pass without it.
      - name: Install raylib (game runtime)
        run: brew install raylib

      - name: Build compiler
        run: |
          export PATH="$(brew --prefix llvm)/bin:$PATH"
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Version check
        run: ./build/cscript --version

      - name: Run test suite
        run: bash tests/run_tests.sh

      # Every Cypescript snippet in README.md must compile, or name the example
      # that backs it. A snippet nobody has run is how the `super()` bug shipped.
      - name: Check README snippets
        run: bash tests/run_readme_tests.sh

      # Runs the games headless (no window, no drawing) and asserts that the
      # simulation actually progresses — see tests/run_game_tests.sh
      - name: Run game tests (headless)
        run: bash tests/run_game_tests.sh

      - name: Compile all examples
        run: |
          for f in example/*.csc example/14_modules/main.csc; do
            case "$f" in *math_utils*) continue;; esac
            echo "=== $f ==="
            ./build/cscript -r "$f"
          done
          rm -f demo_output.txt

      - name: Smoke-run benchmarks (single run)
        run: bash benchmarks/cross/run_cross_benchmarks.sh 1

      - name: Upload compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: cscript-macos-${{ runner.arch }}
          path: |
            build/cscript
            build/libcypescript.a

  build-and-test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM and clang
        run: sudo apt-get update && sudo apt-get install -y cmake llvm-dev clang zlib1g-dev libzstd-dev

      # raylib is built from source by CMake, but on Linux it links against the
      # system X11/GL/audio development headers.
      - name: Install game runtime build dependencies
        run: |
          sudo apt-get install -y \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev libasound2-dev \
            pkg-config time

      - name: Build compiler
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Version check
        run: ./build/cscript --version

      - name: Run test suite
        run: bash tests/run_tests.sh

      # Every Cypescript snippet in README.md must compile, or name the example
      # that backs it. A snippet nobody has run is how the `super()` bug shipped.
      - name: Check README snippets
        run: bash tests/run_readme_tests.sh

      # Headless: no display needed, the game loop still runs and is asserted
      - name: Run game tests (headless)
        run: bash tests/run_game_tests.sh

      - name: Compile all examples
        run: |
          for f in example/*.csc example/14_modules/main.csc; do
            case "$f" in *math_utils*) continue;; esac
            echo "=== $f ==="
            ./build/cscript -r "$f"
          done
          rm -f demo_output.txt

      - name: Build .deb package
        run: bash packaging/build-deb.sh

      # The smoke test below cannot catch a missing dependency: this runner has
      # llvm-dev installed, so cscript starts whether or not the package declares
      # what it links against. A .deb that shipped `Depends: clang` alone while the
      # binary needed libLLVM.so.18 passed CI green and would have failed on a
      # user's machine. So assert the control file against the binary itself,
      # deriving the answer from readelf and dpkg rather than from the same
      # dpkg-shlibdeps call build-deb.sh makes — a check that reruns the producer
      # passes vacuously when the producer silently does nothing.
      - name: Check the .deb declares what the binary needs
        run: |
          set -uo pipefail
          deb=$(ls cypescript_*_*.deb)
          depends=$(dpkg-deb -f "$deb" Depends)
          echo "Depends: $depends"
          names=$(echo "$depends" | tr ',' '\n' | sed 's/(.*)//' | tr -d ' ')

          rm -rf /tmp/debroot && dpkg-deb -x "$deb" /tmp/debroot
          bin=/tmp/debroot/usr/bin/cscript
          missing=0

          for soname in $(readelf -d "$bin" | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p'); do
            path=$(ldd "$bin" | awk -v s="$soname" '$1 == s { print $3 }')
            if [ -z "$path" ]; then
              echo "  ?  $soname — could not resolve, skipping"
              continue
            fi
            pkg=$(dpkg -S "$path" 2>/dev/null || dpkg -S "$(realpath "$path")" 2>/dev/null)
            pkg=$(echo "$pkg" | head -1 | cut -d: -f1)
            if [ -z "$pkg" ]; then
              echo "  ?  $soname — no owning package, skipping"
            elif echo "$names" | grep -Fqx "$pkg"; then
              echo "  ok $soname -> $pkg"
            else
              echo "::error::$soname is provided by '$pkg', which Depends does not name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "The package would fail to start on a machine without the build dependencies."
            exit 1
          fi

      - name: Install and smoke-test the .deb
        run: |
          sudo apt install -y ./cypescript_*_*.deb
          cd /tmp
          echo 'println("hello from the deb");' > hi.csc
          cscript -r hi.csc

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: cypescript-deb-${{ runner.arch }}
          path: cypescript_*.deb

  # Windows is NOT supported yet. The portability work is in the source
  # (executable-path lookup, cmd.exe-safe quoting, per-platform link directives
  # and setjmp/longjmp pairing) but nobody has ever had it build and pass, and a
  # job that is always red just teaches people to ignore CI.
  #
  # So this runs on demand only: trigger the workflow manually to work on it.
  # Known unknowns, in the order they will probably bite:
  #   1. Chocolatey's llvm package may not ship LLVMConfig.cmake, so `cmake`
  #      cannot find LLVM at all.
  #   2. clang++ on Windows targets the MSVC ABI, where -l/-L flags behave
  #      differently from the GNU driver the link line assumes.
  #   3. Windows has no _longjmp, and its SEH unwinding differs from the POSIX
  #      model the exception runtime is built on.
  # Flip it back to running on push once it has actually gone green.
  build-and-test-windows:
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_windows
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM
        run: choco install llvm --no-progress -y

      - name: Build compiler
        run: |
          export PATH="/c/Program Files/LLVM/bin:$PATH"
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel --config Release

      - name: Version check
        run: ./build/cscript.exe --version || ./build/Release/cscript.exe --version

      - name: Run test suite
        run: bash tests/run_tests.sh

      - name: Run game tests (headless)
        run: bash tests/run_game_tests.sh
